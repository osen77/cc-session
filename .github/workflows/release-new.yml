name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.get_version.outputs.version }}

      - name: Verify Cargo version matches tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo version $CARGO_VERSION does not match release tag $VERSION" >&2
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges)
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            Download the appropriate binary for your platform below.

            ### Linux
            ```bash
            # glibc (most distributions)
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/ccs-linux-x86_64.tar.gz

            # musl (Alpine and other musl-based distributions)
            # wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/ccs-linux-x86_64-musl.tar.gz

            tar -xzf ccs-linux-x86_64*.tar.gz
            sudo mv ccs /usr/local/bin/
            ```

            ### macOS
            ```bash
            # For Intel Macs
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/ccs-macos-x86_64.tar.gz

            # For Apple Silicon Macs
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/ccs-macos-aarch64.tar.gz

            tar -xzf ccs-macos-*.tar.gz
            sudo mv ccs /usr/local/bin/
            ```

            ### Windows
            Download the `.zip` file and extract it to a directory in your PATH.
          draft: true
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ccs
            asset_name: ccs-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: ccs
            asset_name: ccs-linux-x86_64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ccs
            asset_name: ccs-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ccs
            asset_name: ccs-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ccs.exe
            asset_name: ccs-windows-x86_64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --verbose

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create tarball (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd -

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          cd -

      - name: Generate checksums (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          cd -

      - name: Generate checksums (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          $hash = Get-FileHash ${{ matrix.asset_name }}.zip -Algorithm SHA256
          $checksumLine = "$($hash.Hash.ToLower())  ${{ matrix.asset_name }}.zip`n"
          $checksumPath = Join-Path (Get-Location).Path "${{ matrix.asset_name }}.zip.sha256"
          [System.IO.File]::WriteAllText($checksumPath, $checksumLine, [System.Text.Encoding]::ASCII)
          cd -
        shell: pwsh

      - name: Upload Release Asset (tarball)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (zip)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    name: Verify and Publish GitHub Release
    needs:
      - create-release
      - build-release
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          expected_assets=(
            ccs-linux-x86_64.tar.gz
            ccs-linux-x86_64.tar.gz.sha256
            ccs-linux-x86_64-musl.tar.gz
            ccs-linux-x86_64-musl.tar.gz.sha256
            ccs-macos-x86_64.tar.gz
            ccs-macos-x86_64.tar.gz.sha256
            ccs-macos-aarch64.tar.gz
            ccs-macos-aarch64.tar.gz.sha256
            ccs-windows-x86_64.zip
            ccs-windows-x86_64.zip.sha256
          )
          mapfile -t actual_assets < <(
            gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort
          )
          if [ "${#actual_assets[@]}" -ne "${#expected_assets[@]}" ]; then
            echo "Expected ${#expected_assets[@]} assets, found ${#actual_assets[@]}" >&2
            printf 'Actual asset: %s\n' "${actual_assets[@]}" >&2
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${actual_assets[@]}" | grep -Fxq "$asset"; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          IS_DRAFT=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release $VERSION is not a draft before finalization" >&2
            exit 1
          fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

