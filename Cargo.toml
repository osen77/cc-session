[package]
name = "claude-code-sync"
version = "0.5.4"
edition = "2021"
authors = ["Claude Code User"]
description = "Sync Claude Code conversation history with git repositories"
license = "MIT"

[[bin]]
name = "ccs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.11"
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
walkdir = "2.5"
colored = "3.1.1"
dirs = "6.0.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
base64 = "0.22.1"
blake3 = "1.8"
inquire = "0.9.2"
log = { version = "0.4.29", features = ["std"] }
atty = "0.2.14"
regex = "1.11"
hostname = "0.4"
fs4 = "1.1.0"
libc = "0.2.182"
tempfile = "3.24.0"

[dev-dependencies]
walkdir = "2.5"
serde_json = "1.0.149"
serial_test = "3.3.1"
rstest = "0.26.1"
# Lets integration tests hold the sync-repo lock from the test process itself,
# so contention is deterministic instead of depending on process timing.
fs4 = "1.1.0"
tempfile = "3.24.0"
